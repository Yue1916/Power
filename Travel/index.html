<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="普吉行程">
<meta name="theme-color" content="#0ea5a4">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>普吉岛行程</title>
<style>
  :root{
    --bg:#0f1720; --card:#17222e; --card2:#1f2e3d; --line:#2c3f52;
    --text:#eef6ff; --muted:#93a7bd; --accent:#0ea5a4; --accent2:#38bdf8;
    --gold:#fbbf24; --danger:#fb7185; --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); padding-bottom:84px; line-height:1.5}
  header{position:sticky; top:0; z-index:20; background:rgba(15,23,32,.92); backdrop-filter:blur(10px);
    padding:14px 16px 12px; border-bottom:1px solid var(--line)}
  header h1{margin:0; font-size:19px}
  header .sub{color:var(--muted); font-size:12px; margin-top:2px}
  main{max-width:720px; margin:0 auto; padding:14px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:15px; margin-bottom:14px}
  .card h2{margin:0 0 12px; font-size:15px; display:flex; align-items:center; gap:8px}
  label{display:block; font-size:13px; color:var(--muted); margin:10px 0 5px}
  input,select,textarea{width:100%; padding:11px; border-radius:11px; border:1px solid var(--line);
    background:var(--card2); color:var(--text); font-size:16px; outline:none; font-family:inherit}
  textarea{min-height:96px; line-height:1.7}
  input:focus,select:focus,textarea:focus{border-color:var(--accent)}
  .row{display:flex; gap:10px}
  .row>*{flex:1}
  .btn{width:100%; padding:13px; border:none; border-radius:12px; font-size:15px; font-weight:600;
    cursor:pointer; margin-top:12px; background:var(--accent); color:#04211f; transition:.12s}
  .btn:active{transform:scale(.98)}
  .btn.ghost{background:var(--card2); color:var(--text); border:1px solid var(--line)}
  .btn.sm{width:auto; padding:8px 14px; margin:0; font-size:14px}
  .btn.blue{background:var(--accent2); color:#042231}
  .tabbar{position:fixed; bottom:0; left:0; right:0; z-index:30; display:flex;
    background:rgba(23,34,46,.97); backdrop-filter:blur(10px); border-top:1px solid var(--line)}
  .tabbar button{flex:1; background:none; border:none; color:var(--muted);
    padding:9px 0 max(9px,env(safe-area-inset-bottom)); font-size:11px; cursor:pointer;
    display:flex; flex-direction:column; align-items:center; gap:3px}
  .tabbar button.active{color:var(--accent)}
  .tabbar .ico{font-size:20px}
  .view{display:none}
  .view.active{display:block}
  .day{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:14px; margin-bottom:14px}
  .dtop{display:flex; justify-content:space-between; align-items:flex-start; gap:10px}
  .dtitle{font-size:16px; font-weight:700}
  .dtitle .dsub{display:block; font-size:13px; color:var(--accent2); font-weight:500; margin-top:2px}
  .dedit{flex:0 0 auto; background:var(--card2); border:1px solid var(--line); color:var(--text);
    border-radius:10px; padding:6px 10px; font-size:13px; cursor:pointer}
  .plan{margin:12px 0 6px}
  .pl{display:flex; gap:8px; padding:5px 0; font-size:14px; border-bottom:1px dashed var(--line)}
  .pl:last-child{border-bottom:none}
  .pl .tm{flex:0 0 auto; color:var(--accent2); font-variant-numeric:tabular-nums; min-width:44px}
  .meta{font-size:13px; color:var(--muted); margin-top:8px}
  .meta b{color:var(--text); font-weight:600}
  .daymoney{display:flex; align-items:center; gap:10px; margin-top:12px; flex-wrap:wrap;
    border-top:1px solid var(--line); padding-top:10px}
  .daymoney .mplan{font-size:13px; color:var(--muted)}
  .daymoney .mact{font-size:14px; font-weight:700; color:var(--gold)}
  .daymoney .sp{flex:1}
  .editbox{display:none; margin-top:12px; border-top:1px solid var(--line); padding-top:10px}
  .editbox.show{display:block}
  .stat-grid{display:flex; gap:10px; margin-bottom:14px; flex-wrap:wrap}
  .stat{flex:1 1 30%; background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:12px; text-align:center}
  .stat .num{font-size:20px; font-weight:800}
  .stat .num.g{color:var(--accent)} .stat .num.gold{color:var(--gold)} .stat .num.warn{color:var(--danger)}
  .stat .sub{font-size:11px; color:var(--muted); margin-top:1px}
  .stat .lbl{font-size:11px; color:var(--muted); margin-top:3px}
  .litem{display:flex; justify-content:space-between; align-items:flex-start; gap:10px; padding:9px 0; border-bottom:1px solid var(--line)}
  .litem:last-child{border-bottom:none}
  .litem .li-nm{font-size:14px} .litem .li-sub{font-size:12px; color:var(--muted); margin-top:2px; line-height:1.5}
  .catin{padding:9px; text-align:right}
  .daychips{display:flex; gap:8px; overflow-x:auto; padding:2px 0 14px; -webkit-overflow-scrolling:touch}
  .dchip{flex:0 0 auto; padding:8px 13px; border-radius:999px; background:var(--card2); border:1px solid var(--line);
    font-size:13px; cursor:pointer; white-space:nowrap; user-select:none}
  .dchip.on{background:var(--accent); border-color:var(--accent); color:#04211f; font-weight:700}
  .planhead{display:flex; justify-content:space-between; align-items:center; margin:12px 0 6px; font-size:14px; font-weight:600}
  .frow{display:flex; align-items:flex-start; gap:8px; font-size:14px; margin-top:9px}
  .frow .flabel{flex:0 0 auto; color:var(--muted)}
  .frow .fval{flex:1; color:var(--text); word-break:break-word}
  .frow .fval.empty{color:var(--muted)}
  .fpen{flex:0 0 auto; background:transparent; border:none; color:var(--accent2); font-size:15px; cursor:pointer; padding:0 2px}
  .fedit{margin-top:9px; background:var(--card2); border:1px solid var(--line); border-radius:11px; padding:11px}
  .fedit label{margin-top:0}
  .crow{display:flex; align-items:center; gap:6px; margin-top:8px; font-size:13px}
  .crow .clabel{flex:0 0 66px; color:var(--muted)}
  .crow .cplan{flex:0 0 auto; color:var(--muted); min-width:66px; font-size:12px}
  .crow .cact{flex:1; padding:8px; text-align:right; min-width:0}
  .crow .ccur{flex:0 0 auto; width:50px; padding:8px 4px}
  .costtot{margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; align-items:baseline; border-top:1px solid var(--line); padding-top:9px; font-size:13px}
  .costtot .mplan{color:var(--muted)} .costtot .mact{color:var(--gold); font-weight:700}
  .costsum{margin-top:10px; border-top:1px solid var(--line); padding-top:9px; font-size:13px; display:flex; flex-direction:column; gap:5px}
  .costsum span{color:var(--muted); display:inline-block; width:38px}
  .costsum b.gold{color:var(--gold)} .costsum b.g{color:var(--accent)} .costsum b.warn{color:var(--danger)}
  .bar{height:16px; border-radius:999px; overflow:hidden; background:var(--card2); border:1px solid var(--line); margin:2px 0 6px}
  .bar > div{height:100%; background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .bar > div.over{background:linear-gradient(90deg,#f97316,var(--danger))}
  .tbl{width:100%; border-collapse:collapse; font-size:13px}
  .tbl th,.tbl td{padding:8px 6px; border-bottom:1px solid var(--line); text-align:center}
  .tbl th{color:var(--muted); font-weight:600; font-size:12px}
  .tbl td.nm{text-align:left}
  .tbl td .over{color:var(--danger)}
  .mini{font-size:12px; color:var(--muted)}
  .hint{font-size:12px; color:var(--muted); margin-top:6px; line-height:1.6}
  .toast{position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(20px);
    background:var(--accent); color:#04211f; padding:11px 20px; border-radius:999px; font-weight:600;
    opacity:0; pointer-events:none; transition:.25s; z-index:60; font-size:14px}
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .modal{position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:70; display:none; align-items:flex-end; justify-content:center}
  .modal.show{display:flex}
  .sheet{background:var(--card); border-top-left-radius:18px; border-top-right-radius:18px; width:100%; max-width:720px;
    padding:18px 16px max(18px,env(safe-area-inset-bottom)); max-height:78vh; overflow:auto}
  .sheet h3{margin:0 0 4px; font-size:16px}
  .exp{display:flex; justify-content:space-between; align-items:center; padding:10px; background:var(--card2);
    border:1px solid var(--line); border-radius:10px; margin-bottom:8px}
  .exp .del{background:transparent; border:none; color:var(--danger); font-size:20px; cursor:pointer}
  .addexp{display:flex; gap:6px; margin:10px 0}
  .addexp input.amt{flex:0 0 26%} .addexp select.cur{flex:0 0 auto; width:56px; padding:11px 6px} .addexp input.note{flex:1}
  .addexp button{flex:0 0 auto; padding:11px 16px; border:none; border-radius:11px; background:var(--accent); color:#04211f; font-weight:700; cursor:pointer}
  code{background:var(--card2); padding:1px 6px; border-radius:6px; font-size:12px}
</style>
</head>
<body>

<header>
  <h1>🏝️ 普吉岛行程</h1>
  <div class="sub" id="headSub">11/28–12/6 · 4人 · 皇帝岛/大象/丛林飞跃…</div>
</header>

<main>
  <!-- ============ 行程 ============ -->
  <section id="view-days" class="view active"></section>

  <!-- ============ 统计 ============ -->
  <section id="view-stats" class="view">
    <div class="card">
      <div class="stat-grid">
        <div class="stat"><div class="num gold" id="stSpent">¥0</div><div class="sub" id="stSpentB">≈฿0</div><div class="lbl">已花(4人合计)</div></div>
        <div class="stat"><div class="num g" id="stBudget">¥0</div><div class="sub" id="stBudgetB">≈฿0</div><div class="lbl">总预算(4人)</div></div>
        <div class="stat"><div class="num" id="stLeft">¥0</div><div class="sub" id="stLeftB">≈฿0</div><div class="lbl">剩余可支配(4人)</div></div>
      </div>
      <div class="bar"><div id="spendBar" style="width:0%"></div></div>
      <div class="hint" id="spendHint"></div>
      <div class="hint" id="perPersonHint" style="margin-top:4px; color:var(--accent2)"></div>
    </div>
    <div class="card">
      <h2>📅 每日花费（计划 vs 实际）</h2>
      <table class="tbl"><thead><tr><th class="nm">日期</th><th>计划(4人)</th><th>实际(4人)</th><th>结余</th></tr></thead><tbody id="dayTbody"></tbody></table>
    </div>
  </section>

  <!-- ============ 计划 ============ -->
  <section id="view-plan" class="view"></section>

  <!-- ============ 设置 ============ -->
  <section id="view-set" class="view">
    <div class="card">
      <h2>⚙️ 设置</h2>
      <div class="row">
        <div><label>人数</label><input type="number" inputmode="numeric" id="cfgPeople" placeholder="4"></div>
        <div><label>人均可支配预算（不含机票）</label><input type="number" inputmode="decimal" id="cfgBudget" placeholder="4500"></div>
      </div>
      <div class="hint" id="totalBudgetHint" style="color:var(--accent2)"></div>
      <div class="row">
        <div><label>统计基准货币</label><select id="cfgCur"><option value="¥">¥ 人民币</option><option value="฿">฿ 泰铢</option></select></div>
        <div><label>汇率（多少泰铢 = 1 元）</label><input type="number" inputmode="decimal" id="cfgRate" placeholder="5"></div>
      </div>
      <div class="hint">记账时可逐笔选 ¥ 或 ฿ 混合记录，App 按此汇率统一换算成基准货币做统计；4 人合计金额记账。</div>
      <button class="btn" id="saveCfg" type="button">保存</button>
    </div>
    <div class="card">
      <h2>💾 数据</h2>
      <div class="hint" id="backupInfo" style="margin-top:0"></div>
      <button class="btn ghost" id="exportBtn" type="button">⬇️ 导出备份 (JSON)</button>
      <button class="btn ghost" id="importBtn" type="button">⬆️ 导入备份</button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
      <button class="btn ghost" id="resetBtn" type="button" style="color:var(--danger)">↩️ 恢复默认行程（保留你的记账）</button>
      <button class="btn ghost" id="clearBtn" type="button" style="color:var(--danger)">🗑️ 全部重置</button>
    </div>
  </section>
</main>

<nav class="tabbar">
  <button data-view="days" class="active"><span class="ico">🗺️</span>行程</button>
  <button data-view="plan"><span class="ico">📋</span>计划</button>
  <button data-view="stats"><span class="ico">📊</span>统计</button>
  <button data-view="set"><span class="ico">⚙️</span>设置</button>
</nav>

<div class="toast" id="toast"></div>


<script>
/* ================= 默认行程数据 ================= */
const DEFAULT_DAYS=[
  {date:'11/28',dow:'周六',title:'抵达 · 普吉镇',hotel:'普吉镇 老腾精品酒店（①段 3 晚）',budget:280,
   cb:{stay:120,food:100,fun:0,transport:40,other:20},
   meals:{b:'（航班上/落地简餐）',l:'（航班上）',d:'老城 One Chun / Kopitiam by Wilai（地道老普吉菜）'},
   plan:'17:40 普吉机场落地，取行李、办电话卡/换钱\n19:00 Grab 前往普吉镇 老腾精品酒店入住\n20:00 老城晚餐、随意夜逛'},
  {date:'11/29',dow:'周日',title:'大象营 + 购物 + 老城夜市',hotel:'普吉镇 老腾精品酒店',budget:800,
   cb:{stay:120,food:120,fun:500,transport:40,other:20},
   meals:{b:'酒店早餐',l:'大象营含餐 / 回程简餐',d:'老城 Lard Yai 周日夜市小吃'},
   plan:'08:30 大象营接送（不骑象观察型，Paklok，普吉镇出发约35分钟）\n喂象/观察/泥浴，约14:00送回\n下午 Central Phuket 商场逛街 + Big C/Lotus 超市囤手信\n傍晚 老城 walk + Lard Yai 周日夜市（Thalang 路 16:00–22:00）'},
  {date:'11/30',dow:'周一',title:'跳岛 Day1 · 皇帝岛 + 珊瑚岛',hotel:'普吉镇 老腾精品酒店',budget:570,
   cb:{stay:120,food:100,fun:300,transport:30,other:20},
   meals:{b:'酒店早餐（早出发可打包）',l:'皇帝岛团餐（多含）',d:'普吉镇/老城 海鲜或泰餐'},
   plan:'07:30 酒店接送前往查龙码头\n08:30 速度艇往皇帝岛（约40分钟，晕船提前吃药、坐船中后、看海平线）\n全天 皇帝岛浮潜/白沙滩 + 珊瑚岛\n16:30 返回普吉镇休息'},
  {date:'12/1',dow:'周二',title:'搬Kata + Karon咖啡 + 射击 + 神仙半岛日落',hotel:'卡塔/卡伦 Kata/Karon（②段 3 晚）',budget:650,
   cb:{stay:130,food:120,fun:300,transport:80,other:20},

   plan:'10:00 普吉镇退房 → Grab 搬去 Kata/Karon 入住（约40分钟）\n午后 Karon On the Hill 山景咖啡/午餐打卡\n16:00 Gold Shooter Club 打靶（神仙半岛附近）\n17:30 神仙半岛 Promthep Cape 看日落\n19:30 Kata 晚餐'},
  {date:'12/2',dow:'周三',title:'跳岛 Day2 · 蛋岛',hotel:'卡塔/卡伦 Kata/Karon',budget:530,

   plan:'09:00 丛林飞跃（Hanuman World / Flying Hanuman，Kathu 一带）\n13:00 午餐\n15:00 Phumontra SPA 按摩放松\n晚上 Kata 自由活动'},
  {date:'12/4',dow:'周五',title:'搬机场旁 + Bangtao海滩俱乐部日落',hotel:'奈扬/迈考 Nai Yang/Mai Khao（③段 2 晚）',budget:510,

   plan:'06:30 退房去机场（5–15分钟）\n08:35 起飞回程'},

const DCATS=[['stay','🏨 住宿'],['food','🍽️ 吃喝'],['fun','🎡 娱乐'],['transport','🚕 交通'],['other','🛍️ 其他']];
const REC_MEALS={}; DEFAULT_DAYS.forEach(d=>REC_MEALS[d.date]={...d.meals});
const REC_TIPS={
 '11/28':'机场→普吉镇 Grab/出租约 600–700฿；电话卡 AIS/True(7–15天) 约 200–350฿（机场柜台或 Klook 预订）。价格为大致参考。',
 '11/29':'大象营（不骑象观察型，如 Phuket Elephant Sanctuary）约 2500–3000฿/人（含接送+午餐），官网/Klook 早订，热门需提前。Central Phuket 商场就在普吉镇，逛街+吃饭+超市一站式；Big C/Lotus 超市适合囤零食干货手信；周日夜市免费逛。',
 '11/30':'皇帝岛+珊瑚岛拼团一日游约 1000–1500฿/人（含接送+午餐+浮潜装备），Klook / KKday 提前订；自备晕船药。',
 '12/1':'普吉镇→Kata Grab 约 500–600฿；Gold Shooter Club 按子弹收费，套餐约 800–1500฿/人（现场付，别被推销加子弹）；神仙半岛免费；Karon On the Hill 建议避开正午、看海景。',
 '12/2':'蛋岛拼团一日游约 900–1300฿/人（含接送+午餐），Klook / KKday。',
 '12/3':'丛林飞跃 Hanuman World / Flying Hanuman 约 1000–1800฿/人（视线路长短，含接送），Klook/官网；Phumontra SPA 按项目约 800–1500฿/人，官网或 LINE 提前预约。',
 '12/4':'Kata→机场旁 Grab 约 600–800฿；Bangtao 海滩俱乐部（Cafe del Mar / Catch）有最低消费，人均约 500–1000฿。',
 '12/5':'机场旁休闲；奈扬海滩海鲜排档人均约 300–600฿。',
 '12/6':'酒店→机场 Grab 约 150–250฿（很近）；国际航班建议提前 2 小时，约 06:30 出发。',
};
const DEFAULT_CFG={budget:4500,people:4,currency:'¥',rate:5,title:'普吉岛 11/28–12/6',
  catBudget:{stay:1050,food:1200,fun:1500,transport:400,other:300}};

/* ================= 工具 ================= */
const $=id=>document.getElementById(id);
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1500)}
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function money(n){n=Math.round((+n||0)*100)/100; const s=Number.isInteger(n)?n:n.toFixed(2); return (DB.config.currency||'¥')+s}

/* ================= 状态 ================= */
const KEY='travel_phuket_v1';
const PLAN_VER=4; // 行程结构版本，变动时自动刷新行程（保留已记的实际支出）
let DB={config:{...DEFAULT_CFG},days:[]};
function newAB(){return {stay:0,food:0,fun:0,transport:0,other:0}}
function newAC(){return {stay:'¥',food:'¥',fun:'¥',transport:'¥',other:'¥'}}
function seedDays(){ DB.days=DEFAULT_DAYS.map(d=>({...d, meals:d.meals?{...d.meals}:{b:'',l:'',d:''}, tips:REC_TIPS[d.date]||'',
  cb:d.cb?{...d.cb}:{stay:0,food:0,fun:0,transport:0,other:0}, ab:newAB(), ac:newAC()})); }
function load(){
  try{const d=JSON.parse(localStorage.getItem(KEY)); if(d&&d.days){DB=d; DB.config={...DEFAULT_CFG,...(d.config||{})};
    DB.days.forEach(x=>{ if(!x.meals) x.meals={b:'',l:'',d:x.food||''}; if(x.tips===undefined) x.tips='';
      if(!x.cb) x.cb={stay:0,food:0,fun:0,transport:0,other:0}; if(!x.ab) x.ab=newAB(); if(!x.ac) x.ac=newAC(); });
    if(!DB.config.catBudget) DB.config.catBudget={...DEFAULT_CFG.catBudget};
    // 行程版本升级：刷新行程内容，保留各天已记的实际支出（ab/ac）
    if(DB.planVer!==PLAN_VER){
      const kAb={},kAc={};
      DB.days.forEach(x=>{
        const abSum=x.ab?DCATS.reduce((s,[k])=>s+((x.ab[k])||0),0):0;
        if(abSum>0){ kAb[x.date]=x.ab; kAc[x.date]=x.ac||{}; }
        else if(x.expenses&&x.expenses.length){ kAb[x.date]={stay:0,food:0,fun:0,transport:0,other:x.expenses.reduce((a,e)=>a+toBase(e),0)}; kAc[x.date]={}; }
      });
      seedDays();
      DB.days.forEach(x=>{ if(kAb[x.date]) x.ab={...x.ab,...kAb[x.date]}; if(kAc[x.date]) x.ac={...x.ac,...kAc[x.date]}; });
      DB.planVer=PLAN_VER; persist();
    }
    return;}}catch(e){}
  DB={config:{...DEFAULT_CFG},days:[]}; seedDays(); DB.planVer=PLAN_VER; persist();
}
function people(){return +DB.config.people||4}
function num(n){n=Math.round((+n||0)*100)/100;return Number.isInteger(n)?n:n.toFixed(2)}
function otherCur(a){const base=DB.config.currency||'¥',rate=+DB.config.rate||5;
  return base==='¥'?`≈฿${num(a*rate)}`:`≈¥${num(a/rate)}`}
// 把一笔花销换算成基准货币（默认人民币）
function toBase(e){
  const base=DB.config.currency||'¥', cur=e.cur||base, amt=+e.amt||0, rate=+DB.config.rate||5;
  if(cur===base) return amt;
  if(base==='¥'&&cur==='฿') return amt/rate;   // 泰铢 → 元
  if(base==='฿'&&cur==='¥') return amt*rate;   // 元 → 泰铢
  return amt;
}
function persist(){localStorage.setItem(KEY,JSON.stringify(DB))}
function dcatBase(d,k){return toBase({amt:(d.ab&&d.ab[k])||0, cur:(d.ac&&d.ac[k])||(DB.config.currency||'¥')})}
function daySpent(d){return DCATS.reduce((s,[k])=>s+dcatBase(d,k),0)}
function totalSpent(){return DB.days.reduce((s,d)=>s+daySpent(d),0)}
function totalPlanned(){return DB.days.reduce((s,d)=>s+(+d.budget||0),0)}

/* ================= 渲染：行程 ================= */
let selectedDay='all';           // 'all' 或 天index
let editState={di:-1,f:null};    // 正在编辑的 天index + 字段

function planTimeline(plan){
  return (plan||'').split('\n').filter(x=>x.trim()).map(line=>{
    const mt=line.match(/^\s*([0-9]{1,2}[:：][0-9]{2}|上午|下午|中午|傍晚|晚上|全天|途中)\s*(.*)$/);
    if(mt) return `<div class="pl"><span class="tm">${esc(mt[1])}</span><span>${esc(mt[2])}</span></div>`;
    return `<div class="pl"><span class="tm">·</span><span>${esc(line)}</span></div>`;
  }).join('');
}
function fieldRow(i,f,icon,label,val,isTa){
  if(editState.di===i && editState.f===f){
    const ed = isTa ? `<textarea id="ed-${i}-${f}">${esc(val)}</textarea>`
                    : `<input id="ed-${i}-${f}" value="${esc(val)}">`;
    return `<div class="fedit"><label>${icon} ${label}</label>${ed}
      <div class="row"><button class="btn sm" data-fsave="${i}:${f}" type="button">保存</button>
      <button class="btn sm ghost" data-fcancel type="button" style="flex:0 0 76px">取消</button></div></div>`;
  }
  return `<div class="frow"><span class="flabel">${icon} ${label}：</span><span class="fval${val?'':' empty'}">${val?esc(val):'（未填，点 ✏️ 添加）'}</span><button class="fpen" data-fedit="${i}:${f}" type="button">✏️</button></div>`;
}
function renderDays(){
  const wrap=$('view-days'); wrap.innerHTML='';
  // 日期选择 chips
  const chips=document.createElement('div'); chips.className='daychips';
  const mk=(key,label)=>{const c=document.createElement('div'); c.className='dchip'+(selectedDay===key?' on':''); c.textContent=label; c.onclick=()=>{selectedDay=key; editState={di:-1,f:null}; renderDays();}; chips.appendChild(c);};
  mk('all','全部');
  DB.days.forEach((d,i)=>mk(i,'D'+(i+1)+' '+d.date));
  wrap.appendChild(chips);

  const pp=people();
  DB.days.forEach((d,i)=>{
    if(selectedDay!=='all' && selectedDay!==i) return;
    if(!d.meals) d.meals={b:'',l:'',d:''};
    const spent=daySpent(d);
    const el=document.createElement('div'); el.className='day';
    const titleBlock = (editState.di===i && editState.f==='title')
      ? `<div class="fedit"><label>标题</label><input id="ed-${i}-title" value="${esc(d.title)}">
         <div class="row"><button class="btn sm" data-fsave="${i}:title" type="button">保存</button>
         <button class="btn sm ghost" data-fcancel type="button" style="flex:0 0 76px">取消</button></div></div>`
      : `<span class="dsub">${esc(d.title)} <button class="fpen" data-fedit="${i}:title" type="button">✏️</button></span>`;
    const planBlock = (editState.di===i && editState.f==='plan')
      ? `<div class="fedit"><label>行程安排（每行一条，可写"14:00 打靶"这样的时间开头）</label>
         <textarea id="ed-${i}-plan">${esc(d.plan)}</textarea>
         <div class="row"><button class="btn sm" data-fsave="${i}:plan" type="button">保存</button>
         <button class="btn sm ghost" data-fcancel type="button" style="flex:0 0 76px">取消</button></div></div>`
      : `<div class="planhead"><span>🗓️ 行程安排</span><button class="fpen" data-fedit="${i}:plan" type="button">✏️</button></div>
         <div class="plan">${planTimeline(d.plan)||'<div class="mini">（点 ✏️ 添加行程）</div>'}</div>`;
    const base=DB.config.currency||'¥';
    const costRows=DCATS.map(([k,label])=>{
      const plan4=((d.cb&&d.cb[k])||0)*pp, av=(d.ab&&d.ab[k])||0, ac=(d.ac&&d.ac[k])||base;
      return `<div class="crow"><span class="clabel">${label}</span>
        <span class="cplan">计划 ${money(plan4)}</span>
        <input class="cact" data-cost="${i}:${k}" type="number" inputmode="decimal" placeholder="实际(4人)" value="${av?av:''}">
        <select class="ccur" data-ccur="${i}:${k}"><option value="¥"${ac==='¥'?' selected':''}>¥</option><option value="฿"${ac==='฿'?' selected':''}>฿</option></select></div>`;
    }).join('');
    const planPPtot=DCATS.reduce((s,[k])=>s+((d.cb&&d.cb[k])||0),0), plan4=planPPtot*pp, left=plan4-spent;
    const costBlock=`<div class="planhead" style="margin-top:12px"><span>💰 预算明细（均按4人）</span></div>
      ${costRows}
      <div class="costsum">
        <div><span>计划</span><b>人均 ${money(planPPtot)}</b> · <b>4人 ${money(plan4)}</b></div>
        <div><span>实际</span><b class="gold">人均 ${money(spent/pp)}</b> · <b class="gold">4人 ${money(spent)}</b></div>
        <div><span>结余</span><b class="${left>=0?'g':'warn'}">4人 ${money(left)}</b> · <b class="${left>=0?'g':'warn'}">人均 ${money(left/pp)}</b></div>
      </div>`;
    el.innerHTML=`
      <div class="dtop"><div class="dtitle">Day ${i+1} · ${esc(d.date)} ${esc(d.dow)}${titleBlock}</div></div>
      ${planBlock}
      ${fieldRow(i,'hotel','🏨','住宿',d.hotel,false)}
      ${fieldRow(i,'b','🍳','早餐',d.meals.b,false)}
      ${fieldRow(i,'l','🍜','午餐',d.meals.l,false)}
      ${fieldRow(i,'d','🍽️','晚餐',d.meals.d,false)}
      ${fieldRow(i,'tips','💡','提示/预订',d.tips||'',true)}
      ${costBlock}`;
    wrap.appendChild(el);
  });

  wrap.querySelectorAll('[data-fedit]').forEach(b=>b.onclick=()=>{const [di,f]=b.dataset.fedit.split(':'); editState={di:+di,f}; renderDays();});
  wrap.querySelectorAll('[data-fcancel]').forEach(b=>b.onclick=()=>{editState={di:-1,f:null}; renderDays();});
  wrap.querySelectorAll('[data-fsave]').forEach(b=>b.onclick=()=>{
    const [di,f]=b.dataset.fsave.split(':'); const i=+di; const v=$('ed-'+i+'-'+f).value; const d=DB.days[i];
    if(f==='title') d.title=v.trim()||d.title;
    else if(f==='plan') d.plan=v;
    else if(f==='hotel') d.hotel=v;
    else if(f==='budget') d.budget=parseFloat(v)||0;
    else if(f==='tips') d.tips=v;
    else if(f==='b'||f==='l'||f==='d'){ if(!d.meals)d.meals={b:'',l:'',d:''}; d.meals[f]=v; }
    editState={di:-1,f:null}; persist(); renderAll(); toast('已保存');
  });
  wrap.querySelectorAll('[data-cost]').forEach(inp=>inp.addEventListener('change',()=>{
    const [di,k]=inp.dataset.cost.split(':'); const d=DB.days[+di]; if(!d.ab)d.ab=newAB(); d.ab[k]=parseFloat(inp.value)||0; persist(); renderAll();
  }));
  wrap.querySelectorAll('[data-ccur]').forEach(sel=>sel.addEventListener('change',()=>{
    const [di,k]=sel.dataset.ccur.split(':'); const d=DB.days[+di]; if(!d.ac)d.ac=newAC(); d.ac[k]=sel.value; persist(); renderAll();
  }));
}

/* ================= 渲染：统计 ================= */
function renderStats(){
  const pp=people();
  const spent=totalSpent();                    // 实际（4人合计）
  const budgetPP=+DB.config.budget||0;         // 人均预算
  const budgetTot=budgetPP*pp;                  // 4人总预算
  const left=budgetTot-spent;
  $('stSpent').textContent=money(spent); $('stSpentB').textContent=otherCur(spent);
  $('stBudget').textContent=money(budgetTot); $('stBudgetB').textContent=otherCur(budgetTot);
  const le=$('stLeft'); le.textContent=money(left); le.className='num '+(left>=0?'g':'warn'); $('stLeftB').textContent=otherCur(left);
  const pct=budgetTot>0?Math.min(100,Math.round(spent/budgetTot*100)):0;
  const bar=$('spendBar'); bar.style.width=pct+'%'; bar.className=spent>budgetTot?'over':'';
  $('spendHint').textContent = budgetTot>0
    ? `已花 ${money(spent)} / 总预算 ${money(budgetTot)}（${pct}%）· 计划合计 ${money(totalPlanned()*pp)}`+(left<0?' · ⚠️ 已超支':'')
    : '在「设置」里填人数和人均预算，这里就会算剩余。';
  $('perPersonHint').textContent = budgetTot>0
    ? `人均：已花 ${money(spent/pp)} · 预算 ${money(budgetPP)} · 剩余 ${money(left/pp)}`
    : '';
  const tb=$('dayTbody'); tb.innerHTML=DB.days.map((d,i)=>{
    const sp=daySpent(d), planTot=(+d.budget||0)*pp, left=planTot-sp;
    const actTxt = sp===0?'—':(sp>planTot?`<span class="over">${money(sp)}</span>`:money(sp));
    const leftTxt = sp===0?'—':(left>=0?money(left):`<span class="over">${money(left)}</span>`);
    return `<tr><td class="nm">${esc(d.date)} ${esc(d.dow)}</td><td>${money(planTot)}</td><td>${actTxt}</td><td>${leftTxt}</td></tr>`;
  }).join('');
}

/* ================= 渲染：设置 ================= */
function renderSet(){
  $('cfgBudget').value=DB.config.budget; $('cfgCur').value=DB.config.currency||'¥';
  $('cfgRate').value=DB.config.rate||5;
  $('cfgPeople').value=people();
  $('totalBudgetHint').textContent=`四人总计预算：${money((+DB.config.budget||0)*people())}`;
  const lb=localStorage.getItem('trip_lastbackup'), bi=$('backupInfo');
  if(!lb){bi.textContent='⚠️ 还没备份过，建议出发前导出一次存好。'; bi.style.color='var(--danger)';}
  else{const days=Math.floor((Date.now()-Number(lb))/86400000);
    bi.textContent='上次备份：'+(days<=0?'今天':days+' 天前'); bi.style.color='var(--muted)';}
}

/* ================= 渲染：计划 ================= */
function renderPlan(){
  const pp=people();
  // 按分类汇总：计划(人均，来自每天明细) vs 实际(4人，来自每天记录)
  const planByCat={}, actByCat={};
  DCATS.forEach(([k])=>{ planByCat[k]=0; actByCat[k]=0; });
  DB.days.forEach(d=>{ DCATS.forEach(([k])=>{ planByCat[k]+=(d.cb&&d.cb[k])||0; actByCat[k]+=dcatBase(d,k); }); });
  const planSum=DCATS.reduce((s,[k])=>s+planByCat[k],0), actSum=DCATS.reduce((s,[k])=>s+actByCat[k],0);
  let html=`<div class="card"><h2>💰 分类预算 vs 实际（全程·4人）</h2><div class="hint" style="margin-top:0">各天明细汇总，随「行程」页实时更新。</div>
    <table class="tbl" style="margin-top:8px"><thead><tr><th class="nm">类别</th><th>计划(4人)</th><th>实际(4人)</th></tr></thead><tbody>`;
  DCATS.forEach(([k,label])=>{
    const p4=planByCat[k]*pp, a=actByCat[k];
    const aTxt=a>p4?`<span class="over">${money(a)}</span>`:money(a);
    html+=`<tr><td class="nm">${label}</td><td>${money(p4)}</td><td>${aTxt}</td></tr>`;
  });
  html+=`</tbody></table>`;
  const plan4=planSum*pp, left4=plan4-actSum;
  html+=`<div class="costsum">
    <div><span>计划</span><b>人均 ${money(planSum)}</b> · <b>4人 ${money(plan4)}</b></div>
    <div><span>实际</span><b class="gold">人均 ${money(actSum/pp)}</b> · <b class="gold">4人 ${money(actSum)}</b></div>
    <div><span>结余</span><b class="${left4>=0?'g':'warn'}">4人 ${money(left4)}（${otherCur(left4)}）</b> · <b class="${left4>=0?'g':'warn'}">人均 ${money(left4/pp)}</b></div>
  </div></div>`;

  // 住宿清单（按连续相同酒店分段）
  const segs=[]; DB.days.forEach(d=>{const h=d.hotel||'—'; const last=segs[segs.length-1]; if(last&&last.hotel===h) last.dates.push(d.date); else segs.push({hotel:h,dates:[d.date]});});
  html+=`<div class="card"><h2>🏨 住宿清单</h2>`+segs.map(s=>`<div class="litem"><div class="li-nm">${esc(s.hotel)}</div><div class="li-sub">${s.dates[0]}${s.dates.length>1?' – '+s.dates[s.dates.length-1]:''}（${s.dates.length}晚）</div></div>`).join('')+`</div>`;

  // 行程清单（简洁：只列每天地点/亮点，详情看行程页）
  html+=`<div class="card"><h2>🗺️ 行程清单</h2>`+DB.days.map((d,i)=>`<div class="litem"><div class="li-nm">D${i+1} · ${esc(d.date)} ${esc(d.dow)}</div><div class="li-sub" style="flex:1; text-align:right; margin-top:0">${esc(d.title)}</div></div>`).join('')+`</div>`;

  // 餐厅清单
  html+=`<div class="card"><h2>🍽️ 餐厅清单</h2>`+DB.days.map(d=>{
    const m=d.meals||{}, parts=[]; if(m.b)parts.push('早·'+m.b); if(m.l)parts.push('午·'+m.l); if(m.d)parts.push('晚·'+m.d);
    return `<div class="litem"><div><div class="li-nm">${esc(d.date)} ${esc(d.dow)}</div><div class="li-sub">${parts.length?esc(parts.join('　｜　')):'（未填）'}</div></div></div>`;
  }).join('')+`</div>`;

  $('view-plan').innerHTML=html;
}

function renderAll(){renderDays();renderPlan();renderStats();renderSet();}

/* ================= 事件 ================= */
document.querySelectorAll('.tabbar button').forEach(b=>b.onclick=()=>{
  document.querySelectorAll('.tabbar button').forEach(x=>x.classList.remove('active'));
  document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));
  b.classList.add('active'); $('view-'+b.dataset.view).classList.add('active'); window.scrollTo(0,0);
});
$('saveCfg').onclick=()=>{
  DB.config.budget=parseFloat($('cfgBudget').value)||0;
  DB.config.people=parseInt($('cfgPeople').value)||4;
  DB.config.currency=$('cfgCur').value||'¥';
  DB.config.rate=parseFloat($('cfgRate').value)||5;
  persist(); renderAll(); toast('已保存');
};
$('exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='普吉行程备份.json'; a.click();
  localStorage.setItem('trip_lastbackup',String(Date.now())); renderSet();
};
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=e=>{
  const f=e.target.files[0]; if(!f)return; const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result); if(!d.days)throw 0;
    DB={config:{...DEFAULT_CFG,...(d.config||{})},days:d.days};
    DB.days.forEach(x=>{ if(!x.meals)x.meals={b:'',l:'',d:''}; if(x.tips===undefined)x.tips=''; if(!x.cb)x.cb={stay:0,food:0,fun:0,transport:0,other:0}; if(!x.ab)x.ab=newAB(); if(!x.ac)x.ac=newAC(); });
    persist(); renderAll(); toast('导入成功');
  }catch(err){toast('文件无法识别')}}; r.readAsText(f);
};
$('resetBtn').onclick=()=>{
  if(!confirm('恢复默认行程？你记录的实际支出会保留、其它编辑会被覆盖。'))return;
  const kAb={},kAc={}; DB.days.forEach(d=>{kAb[d.date]=d.ab; kAc[d.date]=d.ac;});
  seedDays(); DB.days.forEach(d=>{ if(kAb[d.date]) d.ab={...d.ab,...kAb[d.date]}; if(kAc[d.date]) d.ac={...d.ac,...kAc[d.date]}; });
  persist(); renderAll(); toast('已恢复默认行程');
};
$('clearBtn').onclick=()=>{
  if(!confirm('全部重置（行程+记账都清空为默认）？此操作不可撤销。'))return;
  DB={config:{...DEFAULT_CFG},days:[]}; seedDays(); persist(); renderAll(); toast('已重置');
};

/* ================= 启动 ================= */
load(); renderAll();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(()=>{}); }
</script>
</body>
</html>
