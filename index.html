<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="训练记录">
<meta name="theme-color" content="#2f6bff">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="apple-touch-icon.png">
<title>力量训练记录</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  :root{
    --bg:#0f1220; --card:#191d2e; --card2:#232840; --line:#2c3350;
    --text:#eef1ff; --muted:#9aa3c7; --accent:#2f6bff; --accent2:#00d3a7;
    --danger:#ff5470; --gold:#ffcf5c; --radius:16px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); padding-bottom:88px; line-height:1.5;
  }
  header{
    position:sticky; top:0; z-index:20; background:rgba(15,18,32,.9);
    backdrop-filter:blur(10px); padding:16px 16px 12px; border-bottom:1px solid var(--line);
  }
  header h1{margin:0; font-size:20px; display:flex; align-items:center; gap:8px}
  header .sub{color:var(--muted); font-size:12px; margin-top:2px}
  main{max-width:720px; margin:0 auto; padding:16px}
  .card{background:var(--card); border:1px solid var(--line); border-radius:var(--radius); padding:16px; margin-bottom:16px}
  .card h2{margin:0 0 12px; font-size:16px; display:flex; align-items:center; gap:8px}
  .subcard{background:var(--card2); border:1px dashed var(--line); border-radius:14px; padding:14px; margin-top:10px}
  label{display:block; font-size:13px; color:var(--muted); margin:10px 0 5px}
  input,select{
    width:100%; padding:12px; border-radius:12px; border:1px solid var(--line);
    background:var(--card2); color:var(--text); font-size:16px; outline:none;
  }
  .subcard input,.subcard select{background:var(--card)}
  input:focus,select:focus{border-color:var(--accent)}
  .row{display:flex; gap:10px}
  .row>*{flex:1}
  .chips{display:flex; flex-wrap:wrap; gap:8px; margin-top:6px}
  .chip{
    padding:8px 14px; border-radius:999px; background:var(--card2); border:1px solid var(--line);
    font-size:14px; cursor:pointer; user-select:none; transition:.15s;
  }
  .chip.active{background:var(--accent); border-color:var(--accent); color:#fff}
  .chip.cardio.active{background:var(--accent2); border-color:var(--accent2); color:#04241d}
  .btn{
    width:100%; padding:14px; border:none; border-radius:14px; font-size:16px; font-weight:600;
    cursor:pointer; margin-top:14px; background:var(--accent); color:#fff; transition:.15s;
  }
  .btn:active{transform:scale(.98)}
  .btn.green{background:var(--accent2); color:#04241d}
  .btn.ghost{background:var(--card2); color:var(--text); border:1px solid var(--line)}
  .sets-wrap{margin-top:8px}
  .set-row{display:flex; gap:8px; align-items:center; margin-bottom:8px}
  .set-row .idx{width:34px; height:34px; flex:0 0 34px; border-radius:10px; background:var(--card);
    display:flex; align-items:center; justify-content:center; font-size:13px; color:var(--muted)}
  .set-row input{padding:10px}
  .set-row .del{flex:0 0 40px; width:40px; background:transparent; border:none; color:var(--danger);
    font-size:20px; cursor:pointer}
  .tabbar{
    position:fixed; bottom:0; left:0; right:0; z-index:30; display:flex;
    background:rgba(25,29,46,.96); backdrop-filter:blur(10px); border-top:1px solid var(--line);
  }
  .tabbar button{
    flex:1; background:none; border:none; color:var(--muted); padding:10px 0 max(10px,env(safe-area-inset-bottom));
    font-size:11px; cursor:pointer; display:flex; flex-direction:column; align-items:center; gap:3px;
  }
  .tabbar button.active{color:var(--accent)}
  .tabbar .ico{font-size:20px}
  .view{display:none}
  .view.active{display:block}
  .day-group{margin-bottom:18px}
  .day-head{display:flex; justify-content:space-between; align-items:baseline; margin-bottom:8px}
  .day-head .date{font-size:15px; font-weight:600}
  .day-head .vol{font-size:12px; color:var(--muted)}
  .log-item{background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:12px; margin-bottom:8px}
  .log-item .top{display:flex; justify-content:space-between; align-items:center}
  .log-item .name{font-weight:600}
  .log-item .part{font-size:11px; color:var(--muted); background:var(--card); padding:2px 8px; border-radius:999px; margin-left:8px}
  .log-item .part.cardio{color:var(--accent2)}
  .log-item .sets{margin-top:8px; display:flex; flex-wrap:wrap; gap:6px}
  .log-item .set{font-size:13px; background:var(--card); padding:4px 9px; border-radius:8px; color:var(--muted)}
  .log-item .set b{color:var(--text)}
  .log-item .set.pr{color:var(--gold); border:1px solid var(--gold)}
  .empty{text-align:center; color:var(--muted); padding:40px 20px; font-size:14px}
  .empty .big{font-size:40px; margin-bottom:10px}
  .stat-grid{display:flex; gap:10px; margin-bottom:16px}
  .stat{flex:1; background:var(--card2); border:1px solid var(--line); border-radius:12px; padding:12px; text-align:center}
  .stat .num{font-size:22px; font-weight:700}
  .stat .lbl{font-size:11px; color:var(--muted); margin-top:2px}
  .prog-pick{margin-bottom:12px}
  .pr-badge{display:inline-flex; align-items:center; gap:4px; background:rgba(255,207,92,.14);
    color:var(--gold); font-size:12px; padding:4px 10px; border-radius:999px; margin-top:8px}
  canvas{max-height:280px}
  .hint{font-size:12px; color:var(--muted); margin-top:6px}
  .toast{
    position:fixed; left:50%; bottom:100px; transform:translateX(-50%) translateY(20px);
    background:var(--accent2); color:#04241d; padding:12px 22px; border-radius:999px; font-weight:600;
    opacity:0; pointer-events:none; transition:.25s; z-index:50; font-size:14px;
  }
  .toast.show{opacity:1; transform:translateX(-50%) translateY(0)}
  .link{color:var(--accent); cursor:pointer; font-size:13px}
  .toprec{display:flex; justify-content:space-between; padding:10px 0; border-bottom:1px solid var(--line)}
  .toprec:last-child{border-bottom:none}
  .toprec .v{color:var(--gold); font-weight:600}
  /* 本次训练待保存列表 */
  .sess-item{display:flex; justify-content:space-between; align-items:center; background:var(--card2);
    border:1px solid var(--line); border-radius:12px; padding:10px 12px; margin-bottom:8px}
  .sess-item .info{font-size:14px}
  .sess-item .info .nm{font-weight:600}
  .sess-item .info .dt{color:var(--muted); font-size:12px; margin-top:2px}
  .sess-item .rm{background:transparent; border:none; color:var(--danger); font-size:20px; cursor:pointer}
  .badge-part{font-size:10px; background:var(--card); color:var(--muted); padding:1px 7px; border-radius:999px; margin-left:6px}
  .quickfill{display:flex; align-items:center; gap:6px; margin-top:6px}
  .quickfill input{padding:10px; text-align:center; min-width:0}
  .quickfill span{color:var(--muted); flex:0 0 auto}
  .quickfill .qf-btn{flex:0 0 auto; padding:10px 16px; border:none; border-radius:12px;
    background:var(--accent); color:#fff; font-size:14px; font-weight:600; cursor:pointer}
</style>
</head>
<body>

<header>
  <h1>🏋️ 力量训练记录</h1>
  <div class="sub">记录每一组，见证每一次进步</div>
</header>

<main>
  <!-- ============ 记录 ============ -->
  <section id="view-log" class="view active">
    <div class="card">
      <h2>📝 本次训练</h2>

      <label>训练日期</label>
      <input type="date" id="date">

      <label>训练部位（可多选）</label>
      <div class="chips" id="partChips"></div>

      <!-- 已添加动作列表 -->
      <label style="margin-top:14px">已添加动作</label>
      <div id="sessionList"></div>

      <!-- 添加动作区 -->
      <div class="subcard">
        <div style="font-size:14px;font-weight:600;margin-bottom:4px">➕ 添加一个动作</div>

        <label>选择动作</label>
        <select id="exercise"></select>

        <label>或输入新动作</label>
        <div class="row">
          <input type="text" id="exerciseNew" placeholder="新动作名（选填）">
          <select id="newPart" style="flex:0 0 110px"></select>
        </div>

        <!-- 力量输入 -->
        <div id="strengthInputs">
          <label>快速填充（相同的组一次搞定）</label>
          <div class="quickfill">
            <input type="number" inputmode="decimal" id="qfW" placeholder="重量kg">
            <span>×</span>
            <input type="number" inputmode="numeric" id="qfR" placeholder="次数">
            <span>×</span>
            <input type="number" inputmode="numeric" id="qfSets" placeholder="组数">
            <button class="qf-btn" id="qfBtn" type="button">生成</button>
          </div>
          <label>组数（重量 kg × 次数）</label>
          <div class="sets-wrap" id="setsWrap"></div>
          <button class="btn ghost" id="addSet" type="button" style="margin-top:4px">＋ 增加一组</button>
        </div>

        <!-- 有氧输入 -->
        <div id="cardioInputs" style="display:none">
          <div class="row">
            <div><label>时长（分钟）</label><input type="number" inputmode="numeric" id="cardioMin" placeholder="如 30"></div>
            <div><label>距离（km，选填）</label><input type="number" inputmode="decimal" id="cardioKm" placeholder="如 5"></div>
          </div>
        </div>

        <button class="btn" id="addExercise" type="button">加入本次训练</button>
      </div>

      <button class="btn green" id="saveBtn" type="button">✅ 保存本次训练</button>
    </div>

    <div class="card" id="lastCard" style="display:none">
      <h2>💡 上次同动作</h2>
      <div id="lastInfo"></div>
    </div>
  </section>

  <!-- ============ 历史 ============ -->
  <section id="view-history" class="view">
    <div class="stat-grid">
      <div class="stat"><div class="num" id="stDays">0</div><div class="lbl">训练天数</div></div>
      <div class="stat"><div class="num" id="stSets">0</div><div class="lbl">力量组数</div></div>
      <div class="stat"><div class="num" id="stVol">0</div><div class="lbl">总容量(吨)</div></div>
    </div>
    <div id="historyList"></div>
  </section>

  <!-- ============ 进步 ============ -->
  <section id="view-progress" class="view">
    <div class="card">
      <h2>📈 进步曲线</h2>
      <div class="prog-pick">
        <label>选择动作</label>
        <select id="progExercise"></select>
      </div>
      <canvas id="chart"></canvas>
      <div id="prBadge"></div>
      <div class="hint" id="progHint">力量动作看「最大重量」走势，有氧看「时长 / 距离」走势。</div>
    </div>
    <div class="card">
      <h2>🏆 各动作个人最佳 (PR)</h2>
      <div id="prList"></div>
    </div>
  </section>

  <!-- ============ 设置 ============ -->
  <section id="view-settings" class="view">
    <div class="card">
      <h2>⚙️ 数据管理</h2>
      <p class="hint" style="font-size:13px">数据保存在本设备浏览器中。建议定期导出备份，换设备时可导入。</p>
      <button class="btn ghost" id="exportBtn" type="button">⬇️ 导出备份 (JSON)</button>
      <button class="btn ghost" id="importBtn" type="button">⬆️ 导入备份</button>
      <input type="file" id="importFile" accept="application/json" style="display:none">
      <button class="btn ghost" id="clearBtn" type="button" style="color:var(--danger)">🗑️ 清空所有记录</button>
    </div>
    <div class="card">
      <h2>ℹ️ 使用小贴士</h2>
      <p class="hint" style="font-size:13px; line-height:1.7">
      · 手机浏览器打开后，可用「添加到主屏幕」当 App 用<br>
      · 部位可多选，一次训练可连续加入多个动作，最后一起保存<br>
      · 有氧动作按「时长/距离」记录<br>
      · 金色标记 🥇 代表刷新了该动作的历史最佳
      </p>
    </div>
  </section>
</main>

<nav class="tabbar">
  <button data-view="log" class="active"><span class="ico">📝</span>记录</button>
  <button data-view="history"><span class="ico">📚</span>历史</button>
  <button data-view="progress"><span class="ico">📈</span>进步</button>
  <button data-view="settings"><span class="ico">⚙️</span>设置</button>
</nav>

<div class="toast" id="toast"></div>

<script>
/* ================= 数据层 ================= */
const KEY='strength_log_v1';
const DEFAULT_PARTS={
  '胸':['卧推','上斜卧推','哑铃飞鸟','双杠臂屈伸','器械推胸','哑铃平板卧推','蝴蝶机夹胸'],
  '背':['引体向上','高位下拉','杠铃划船','坐姿划船','硬拉','辅助引体向上','反握高位下拉','绳索面拉','俯身飞鸟','蝴蝶机反向飞鸟','直臂下拉','大剪刀下拉'],
  '腿':['深蹲','器械倒蹬','箭步蹲','腿屈伸','腿弯举','提踵','龙门架绳索深蹲','犀牛蹲','U型杠铃深蹲','绳索后踢腿','绳索侧踢腿','哈克深蹲'],
  '臀':['臀冲','硬拉','相扑硬拉','臀桥','哈克深蹲（早安式）','保加利亚单腿蹲','坐姿髋外展','坐姿髋内收','器械倒蹬','器械后蹬腿'],
  '肩':['站姿推举','哑铃推举','侧平举','前平举','器械推肩','蝴蝶机反向飞鸟','绳索面拉'],
  '手臂':['杠铃弯举','哑铃弯举','三头下压','窄距卧推','锤式弯举'],
  '核心':['卷腹','平板支撑','悬垂举腿','俄罗斯转体'],
  '有氧':['跑步机','户外跑','椭圆机','动感单车','划船机','爬楼机','跳绳']
};
const CARDIO='有氧';
function load(){ try{return JSON.parse(localStorage.getItem(KEY))||{logs:[]}}catch(e){return {logs:[]}} }
function save(d){ localStorage.setItem(KEY, JSON.stringify(d)) }
let DB=load();

/* ================= 通用 ================= */
const $=id=>document.getElementById(id);
function toast(msg){const t=$('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1600)}
function todayStr(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
function fmtDate(s){const d=new Date(s+'T00:00');const w=['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];return `${s} ${w}`}
function isCardio(part){return part===CARDIO}
function partOfExercise(ex){
  for(const p in DEFAULT_PARTS) if(DEFAULT_PARTS[p].includes(ex)) return p;
  const l=DB.logs.find(l=>l.exercise===ex); return l?l.part:null;
}

/* ================= 记录页 ================= */
let selectedParts=new Set(['胸']);   // 多选部位
let session=[];                       // 本次待保存的动作

function renderParts(){
  const wrap=$('partChips'); wrap.innerHTML='';
  Object.keys(DEFAULT_PARTS).forEach(p=>{
    const c=document.createElement('div');
    c.className='chip'+(isCardio(p)?' cardio':'')+(selectedParts.has(p)?' active':''); c.textContent=p;
    c.onclick=()=>{ selectedParts.has(p)?selectedParts.delete(p):selectedParts.add(p);
      renderParts(); renderExerciseSelect(); renderNewPart() };
    wrap.appendChild(c);
  });
}
function exercisesOfParts(){
  const out=[];
  selectedParts.forEach(p=>{
    (DEFAULT_PARTS[p]||[]).forEach(e=>{ if(!out.includes(e)) out.push(e) });
    DB.logs.filter(l=>l.part===p).forEach(l=>{ if(!out.includes(l.exercise)) out.push(l.exercise) });
  });
  return out;
}
function renderExerciseSelect(){
  const sel=$('exercise'); const cur=sel.value; sel.innerHTML='';
  const exs=exercisesOfParts();
  if(!exs.length){sel.innerHTML='<option value="">请先在上方选择部位</option>'}
  else exs.forEach(e=>{const o=document.createElement('option');o.value=e;o.textContent=e;sel.appendChild(o)});
  if(exs.includes(cur))sel.value=cur;
  updateAddForm();
}
function renderNewPart(){
  const sel=$('newPart'); const cur=sel.value; sel.innerHTML='';
  const parts=selectedParts.size?[...selectedParts]:Object.keys(DEFAULT_PARTS);
  parts.forEach(p=>{const o=document.createElement('option');o.value=p;o.textContent=p;sel.appendChild(o)});
  if(parts.includes(cur))sel.value=cur;
}

function currentAdd(){ // 返回当前正要添加的 {exercise, part, type}
  const nw=$('exerciseNew').value.trim();
  if(nw) return {exercise:nw, part:$('newPart').value, type:isCardio($('newPart').value)?'cardio':'strength'};
  const ex=$('exercise').value;
  if(!ex) return null;
  const part=partOfExercise(ex)||[...selectedParts][0]||'胸';
  return {exercise:ex, part, type:isCardio(part)?'cardio':'strength'};
}
function updateAddForm(){
  const c=currentAdd();
  const cardio=c&&c.type==='cardio';
  $('strengthInputs').style.display=cardio?'none':'block';
  $('cardioInputs').style.display=cardio?'block':'none';
  showLast();
}
function addSetRow(w='',r=''){
  const wrap=$('setsWrap');
  const div=document.createElement('div'); div.className='set-row';
  div.innerHTML=`<div class="idx">${wrap.children.length+1}</div>
    <input type="number" inputmode="decimal" placeholder="重量kg" class="w" value="${w}">
    <input type="number" inputmode="numeric" placeholder="次数" class="r" value="${r}">
    <button class="del" type="button">✕</button>`;
  div.querySelector('.del').onclick=()=>{div.remove(); reindexSets()};
  wrap.appendChild(div);
}
function reindexSets(){[...$('setsWrap').children].forEach((c,i)=>c.querySelector('.idx').textContent=i+1)}
function resetSets(){ $('setsWrap').innerHTML=''; addSetRow(); addSetRow(); addSetRow() }
function resetAddForm(){ $('exerciseNew').value=''; $('cardioMin').value=''; $('cardioKm').value=''; resetSets(); renderExerciseSelect() }

function showLast(){
  const c=currentAdd();
  const card=$('lastCard'), info=$('lastInfo');
  if(!c){card.style.display='none';return}
  const prev=DB.logs.filter(l=>l.exercise===c.exercise).sort((a,b)=>b.date.localeCompare(a.date))[0];
  if(!prev){card.style.display='none';return}
  card.style.display='block';
  if(prev.type==='cardio'){
    info.innerHTML=`<div style="font-weight:600;margin-bottom:6px">${prev.exercise} · ${fmtDate(prev.date)}</div>`+
      `<div class="log-item"><div class="sets"><span class="set"><b>${prev.cardio.min}</b>分钟`+
      (prev.cardio.km?` · <b>${prev.cardio.km}</b>km`:'')+`</span></div>`+
      `<div class="hint">上次练了 ${prev.cardio.min} 分钟，试试今天多坚持一会 💪</div></div>`;
  }else{
    const maxW=Math.max(...prev.sets.map(s=>s.w));
    info.innerHTML=`<div style="font-weight:600;margin-bottom:6px">${prev.exercise} · ${fmtDate(prev.date)}</div>`+
      `<div class="log-item"><div class="sets">`+
      prev.sets.map(s=>`<span class="set"><b>${s.w}</b>kg × <b>${s.r}</b></span>`).join('')+
      `</div><div class="hint">上次最大重量 ${maxW}kg，试试今天加 2.5kg？</div></div>`;
  }
}

function buildItem(){ // 从当前表单构造一个动作项，非法返回 null
  const c=currentAdd();
  if(!c) return null;
  if(c.type==='cardio'){
    const min=parseFloat($('cardioMin').value);
    if(isNaN(min)||min<=0) return {err:'请填写有氧时长'};
    const km=parseFloat($('cardioKm').value);
    return {...c, cardio:{min, km:isNaN(km)?null:km}};
  }else{
    const sets=[...$('setsWrap').children].map(x=>({
      w:parseFloat(x.querySelector('.w').value), r:parseInt(x.querySelector('.r').value)
    })).filter(s=>!isNaN(s.w)&&!isNaN(s.r)&&s.r>0);
    if(!sets.length) return {err:'请至少填写一组有效数据'};
    return {...c, sets};
  }
}
function renderSession(){
  const box=$('sessionList');
  if(!session.length){box.innerHTML='<div class="hint">还没添加动作，在下方选择并「加入本次训练」。</div>';return}
  box.innerHTML=session.map((it,i)=>{
    const detail=it.type==='cardio'
      ? `${it.cardio.min}分钟`+(it.cardio.km?` · ${it.cardio.km}km`:'')
      : it.sets.map(s=>`${s.w}×${s.r}`).join('  ');
    return `<div class="sess-item"><div class="info">
      <div class="nm">${it.exercise}<span class="badge-part">${it.part}</span></div>
      <div class="dt">${detail}</div></div>
      <button class="rm" onclick="rmSession(${i})">✕</button></div>`;
  }).join('');
}
function rmSession(i){session.splice(i,1);renderSession()}

$('addSet').onclick=()=>addSetRow();
$('qfBtn').onclick=()=>{
  const w=parseFloat($('qfW').value), r=parseInt($('qfR').value), n=parseInt($('qfSets').value);
  if(isNaN(w)||isNaN(r)||r<=0){toast('请填写重量和次数');return}
  if(isNaN(n)||n<=0){toast('请填写组数');return}
  // 若当前只有空白组，先清掉再生成
  const rows=[...$('setsWrap').children];
  const allEmpty=rows.every(c=>!c.querySelector('.w').value && !c.querySelector('.r').value);
  if(allEmpty)$('setsWrap').innerHTML='';
  for(let i=0;i<n;i++)addSetRow(w,r);
  $('qfW').value=''; $('qfR').value=''; $('qfSets').value='';
  toast(`已生成 ${n} 组`);
};
$('exercise').onchange=updateAddForm;
$('exerciseNew').oninput=updateAddForm;
$('newPart').onchange=updateAddForm;

$('addExercise').onclick=()=>{
  const it=buildItem();
  if(!it){toast('请选择或输入动作');return}
  if(it.err){toast(it.err);return}
  session.push(it); renderSession(); resetAddForm();
  toast('已加入本次训练');
};

$('saveBtn').onclick=()=>{
  // 若表单里还有没点“加入”的有效动作，自动纳入
  const pending=buildItem();
  if(pending && !pending.err) session.push(pending);
  if(!session.length){toast('请先加入至少一个动作');return}
  const date=$('date').value||todayStr();
  session.forEach((it,idx)=>{
    const log={id:Date.now()+idx, date, part:it.part, exercise:it.exercise, type:it.type};
    if(it.type==='cardio') log.cardio=it.cardio; else log.sets=it.sets;
    DB.logs.push(log);
  });
  save(DB);
  const n=session.length; session=[]; renderSession(); resetAddForm();
  toast(`已保存 ${n} 个动作 ✅`);
  refreshAll();
};

/* ================= 历史页 ================= */
function volumeOf(log){return log.type==='cardio'?0:log.sets.reduce((s,x)=>s+x.w*x.r,0)}
function metricOf(log){return log.type==='cardio'?log.cardio.min:Math.max(...log.sets.map(s=>s.w))}
function bestBefore(exercise,beforeId){
  let m=0; DB.logs.filter(l=>l.exercise===exercise&&l.id<beforeId).forEach(l=>{const v=metricOf(l); if(v>m)m=v});
  return m;
}
function renderHistory(){
  const list=$('historyList');
  if(!DB.logs.length){list.innerHTML='<div class="empty"><div class="big">📭</div>还没有记录，去「记录」页添加第一条吧！</div>';
    $('stDays').textContent=0;$('stSets').textContent=0;$('stVol').textContent=0;return}
  const byDate={};
  DB.logs.forEach(l=>{(byDate[l.date]=byDate[l.date]||[]).push(l)});
  const dates=Object.keys(byDate).sort((a,b)=>b.localeCompare(a));
  let totalSets=0,totalVol=0;
  DB.logs.forEach(l=>{if(l.type!=='cardio')totalSets+=l.sets.length; totalVol+=volumeOf(l)});
  $('stDays').textContent=dates.length;
  $('stSets').textContent=totalSets;
  $('stVol').textContent=(totalVol/1000).toFixed(1);

  list.innerHTML=dates.map(date=>{
    const items=byDate[date];
    const dayVol=items.reduce((s,l)=>s+volumeOf(l),0);
    return `<div class="day-group">
      <div class="day-head"><span class="date">${fmtDate(date)}</span>
      <span class="vol">${items.length}个动作${dayVol?' · '+Math.round(dayVol)+'kg':''}</span></div>`+
      items.map(l=>{
        const prevBest=bestBefore(l.exercise,l.id);
        const cur=metricOf(l);
        const isPR=cur>prevBest && prevBest>0;
        const partCls=l.type==='cardio'?'part cardio':'part';
        let setsHtml, prText='';
        if(l.type==='cardio'){
          setsHtml=`<span class="set${isPR?' pr':''}"><b>${l.cardio.min}</b>分钟`+(l.cardio.km?` · <b>${l.cardio.km}</b>km`:'')+`</span>`;
          if(isPR)prText='🥇 刷新最长时长 '+prevBest+'→'+cur+'分钟';
        }else{
          const maxW=Math.max(...l.sets.map(s=>s.w));
          setsHtml=l.sets.map(s=>`<span class="set${s.w===maxW&&isPR?' pr':''}"><b>${s.w}</b>kg×<b>${s.r}</b></span>`).join('');
          if(isPR)prText='🥇 刷新最大重量 '+prevBest+'→'+cur+'kg';
        }
        return `<div class="log-item">
          <div class="top"><div><span class="name">${l.exercise}</span><span class="${partCls}">${l.part}</span></div>
          <span class="link" onclick="delLog(${l.id})">删除</span></div>
          <div class="sets">${setsHtml}</div>${prText?'<div class="pr-badge">'+prText+'</div>':''}</div>`;
      }).join('')+`</div>`;
  }).join('');
}
function delLog(id){
  if(!confirm('确定删除这条记录？'))return;
  DB.logs=DB.logs.filter(l=>l.id!==id); save(DB); refreshAll(); toast('已删除');
}

/* ================= 进步页 ================= */
let chart=null;
function allExercises(){return [...new Set(DB.logs.map(l=>l.exercise))]}
function renderProgSelect(){
  const sel=$('progExercise'); const cur=sel.value;
  const exs=allExercises();
  sel.innerHTML=exs.length?exs.map(e=>`<option>${e}</option>`).join(''):'<option value="">暂无数据</option>';
  if(exs.includes(cur))sel.value=cur;
  sel.onchange=drawChart;
}
function drawChart(){
  const ex=$('progExercise').value;
  const rows=DB.logs.filter(l=>l.exercise===ex).sort((a,b)=>a.date.localeCompare(b.date));
  if(chart)chart.destroy();
  if(!rows.length){$('prBadge').innerHTML='';return}
  const labels=rows.map(r=>r.date.slice(5));
  const cardio=rows[0].type==='cardio';
  let datasets, scales;
  if(cardio){
    const minData=rows.map(r=>r.cardio.min);
    const kmData=rows.map(r=>r.cardio.km||0);
    const best=Math.max(...minData);
    $('prBadge').innerHTML=`<div class="pr-badge">🏆 ${ex} 最长时长 ${best}分钟</div>`;
    datasets=[
      {type:'line',label:'时长(分钟)',data:minData,borderColor:'#2f6bff',backgroundColor:'#2f6bff',tension:.3,yAxisID:'y',pointRadius:4,borderWidth:3},
      {type:'bar',label:'距离(km)',data:kmData,backgroundColor:'rgba(0,211,167,.35)',yAxisID:'y1',borderRadius:6}
    ];
    scales={
      x:{ticks:{color:'#9aa3c7'},grid:{color:'#2c3350'}},
      y:{position:'left',ticks:{color:'#2f6bff'},grid:{color:'#2c3350'},title:{display:true,text:'分钟',color:'#2f6bff'}},
      y1:{position:'right',ticks:{color:'#00d3a7'},grid:{drawOnChartArea:false},title:{display:true,text:'km',color:'#00d3a7'}}
    };
  }else{
    const maxData=rows.map(r=>Math.max(...r.sets.map(s=>s.w)));
    const volData=rows.map(r=>Math.round(volumeOf(r)));
    const best=Math.max(...maxData);
    $('prBadge').innerHTML=`<div class="pr-badge">🏆 ${ex} 历史最大重量 ${best}kg</div>`;
    datasets=[
      {type:'line',label:'最大重量(kg)',data:maxData,borderColor:'#2f6bff',backgroundColor:'#2f6bff',tension:.3,yAxisID:'y',pointRadius:4,borderWidth:3},
      {type:'bar',label:'训练容量(kg)',data:volData,backgroundColor:'rgba(0,211,167,.35)',yAxisID:'y1',borderRadius:6}
    ];
    scales={
      x:{ticks:{color:'#9aa3c7'},grid:{color:'#2c3350'}},
      y:{position:'left',ticks:{color:'#2f6bff'},grid:{color:'#2c3350'},title:{display:true,text:'重量kg',color:'#2f6bff'}},
      y1:{position:'right',ticks:{color:'#00d3a7'},grid:{drawOnChartArea:false},title:{display:true,text:'容量kg',color:'#00d3a7'}}
    };
  }
  chart=new Chart($('chart'),{
    data:{labels,datasets},
    options:{responsive:true,interaction:{mode:'index',intersect:false},
      plugins:{legend:{labels:{color:'#9aa3c7'}}},scales}
  });
}
function renderPRList(){
  const map={};
  DB.logs.forEach(l=>{const v=metricOf(l); if(!map[l.exercise]||v>map[l.exercise].v)map[l.exercise]={v,date:l.date,type:l.type}});
  const keys=Object.keys(map).sort((a,b)=>map[b].v-map[a].v);
  $('prList').innerHTML=keys.length?keys.map(k=>{
    const unit=map[k].type==='cardio'?'分钟':'kg';
    return `<div class="toprec"><span>${k}</span><span class="v">${map[k].v}${unit} <span style="color:var(--muted);font-weight:400;font-size:12px">(${map[k].date.slice(5)})</span></span></div>`;
  }).join(''):'<div class="empty">暂无数据</div>';
}

/* ================= 设置页 ================= */
$('exportBtn').onclick=()=>{
  const blob=new Blob([JSON.stringify(DB,null,2)],{type:'application/json'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download='训练记录备份_'+todayStr()+'.json'; a.click(); toast('已导出');
};
$('importBtn').onclick=()=>$('importFile').click();
$('importFile').onchange=e=>{
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const d=JSON.parse(r.result); if(!d.logs)throw 0;
    DB=d; save(DB); refreshAll(); toast('导入成功');
  }catch(err){toast('文件格式错误')}};
  r.readAsText(f); e.target.value='';
};
$('clearBtn').onclick=()=>{
  if(!confirm('确定清空全部记录？此操作不可恢复！'))return;
  DB={logs:[]}; save(DB); refreshAll(); toast('已清空');
};

/* ================= 导航 ================= */
document.querySelectorAll('.tabbar button').forEach(b=>{
  b.onclick=()=>{
    document.querySelectorAll('.tabbar button').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    b.classList.add('active');
    $('view-'+b.dataset.view).classList.add('active');
    if(b.dataset.view==='progress'){renderProgSelect();drawChart();renderPRList()}
  };
});

/* ================= 刷新 ================= */
function refreshAll(){renderExerciseSelect();renderHistory();renderProgSelect();renderPRList();
  if($('view-progress').classList.contains('active'))drawChart();}
window.delLog=delLog; window.rmSession=rmSession;

/* ================= 初始化 ================= */
$('date').value=todayStr();
renderParts(); renderNewPart(); renderExerciseSelect(); resetSets(); renderSession(); renderHistory();
</script>
